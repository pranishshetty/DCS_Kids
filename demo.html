<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Year Success Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<style>
    .timeline-two-sided {
    position: relative;
}

/* The main vertical line */
.timeline-two-sided::before {
    content: '';
    position: absolute;
    top: 100px;
    bottom: 0;
    left: 50%;
    width: 2px;
    background-color: #adb5bd;
    transform: translateX(-50%);
}

/* The central marker dot */
.timeline-dot {
    width: 40px;
    height: 40px;
    line-height: 40px;
    border-radius: 50%;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    position: absolute; /* Allows for easy centering */
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    box-shadow: 0 0 0 5px #fff; /* White ring around the dot */
}

/* Space out the items */
.timeline-item-split {
    padding-bottom: 60px;
    position: relative;
}

/* Responsive adjustment for mobile (collapses to a single-sided timeline) */
@media (max-width: 768px) {
    .timeline-two-sided::before {
        left: 20px; /* Shift line to the left */
        transform: none;
    }
    .timeline-dot {
        left: 20px;
        transform: none;
    }
    .col-md-5, .col-md-2 {
        flex: 0 0 100%; /* Make all columns full width */
        max-width: 100%;
        text-align: left !important;
    }
    /* Push content away from the new left-aligned marker */
    .timeline-item-split .card {
        margin-left: 50px;
    }
}
</style>
    <div class="container py-5 timeline-two-sided">
    <h2 class="text-center mb-5 text-danger">⚖️ Two-Sided Split Timeline</h2>

    <div class="row justify-content-center timeline-item-split">
        <div class="col-md-5 text-md-end mb-4 mb-md-0">
            <div class="card shadow-sm border-start border-danger border-5">
                <div class="card-body">
                    <h5 class="card-title text-danger">Year 1: Define</h5>
                    <p class="card-text">Completed market research and secured initial angel investment. Built a core team of 4 founders.</p>
                </div>
            </div>
        </div>
        <div class="col-md-2 text-center timeline-marker">
            <div class="timeline-dot bg-danger">1</div>
        </div>
        <div class="col-md-5"></div>
    </div>

    <div class="row justify-content-center timeline-item-split">
        <div class="col-md-5"></div>
        <div class="col-md-2 text-center timeline-marker">
            <div class="timeline-dot bg-primary">2</div>
        </div>
        <div class="col-md-5 text-md-start mb-4 mb-md-0">
            <div class="card shadow-sm border-end border-primary border-5">
                <div class="card-body">
                    <h5 class="card-title text-primary">Year 2: Develop</h5>
                    <p class="card-text">Launched the beta product. Gathered 1,000 users and iterated based on feedback (V1.2).</p>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
