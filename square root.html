     <div class="container">
    <h1>Square & Cube Root Learning</h1>

    <label>Enter a Number:</label>
    <input type="number" id="numberInput" placeholder="Enter number">
    <button onclick="calculate()">Calculate</button>

    <div id="resultArea"></div>
</div>
    </section>
<script>
    function calculate() {
    let num = document.getElementById("numberInput").value;

    if(num === "") {
        alert("Please enter a number!");
        return;
    }

    num = Number(num);

    let square = num * num;
    let cube = num * num * num;
    let sqrt = Math.sqrt(num).toFixed(3);
    let cbrt = Math.cbrt(num).toFixed(3);

    document.getElementById("resultArea").innerHTML = `
        <p><b>Number:</b> ${num}</p>
        <p><b>Square (${num}²):</b> ${square}</p>
        <p><b>Cube (${num}³):</b> ${cube}</p>
        <p><b>Square Root (√${num}):</b> ${sqrt}</p>
        <p><b>Cube Root (³√${num}):</b> ${cbrt}</p>
    `;
}
  </script>
