    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter a word (e.g., happy)" />
      <button onclick="searchWord()">Search</button>
    </div>

  <script>
async function searchWord() {
  const word = document.getElementById("searchInput").value.trim();
  const resultBox = document.getElementById("result");

  if (!word) {
    resultBox.innerHTML = "<p>Please enter a word.</p>";
    return;
  }

  resultBox.innerHTML = "<p>Loading...</p>";

  try {
    // Primary Dictionary API
    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    
    // Datamuse API for synonyms/antonyms
    const synRes = await fetch(`https://api.datamuse.com/words?rel_syn=${word}`);
    const antRes = await fetch(`https://api.datamuse.com/words?rel_ant=${word}`);

    const synonyms = await synRes.json();
    const antonyms = await antRes.json();

    let dictData = null;

    if (dictRes.ok) {
      dictData = await dictRes.json();
    }

    let html = `<h2>${word}</h2>`;

    // Pronunciation
    if (dictData && dictData[0].phonetics.length > 0) {
      const audio = dictData[0].phonetics.find(p => p.audio);
      if (audio && audio.audio) {
        html += `
          <button onclick="playAudio('${audio.audio}')">🔊 Play Pronunciation</button>
          <audio id="audioPlayer"></audio>
        `;
      }
    }

    // Definitions
    if (dictData) {
      dictData[0].meanings.forEach(meaning => {
        html += `
          <h3>${meaning.partOfSpeech}</h3>
          <ul>
            ${meaning.definitions
              .map(d => `<li>${d.definition} ${d.example ? "<br><em>Example: " + d.example + "</em>" : ""}</li>`)
              .join("")}
          </ul>
        `;
      });
    } else {
      html += "<p>No definition found in Dictionary API.</p>";
    }

    // Synonyms
    html += `<h3>Synonyms</h3><div class="synonyms">`;
    if (synonyms.length > 0) {
      synonyms.slice(0, 20).forEach(s => {
        html += `<span onclick="autoSearch('${s.word}')">${s.word}</span>`;
      });
    } else {
      html += "<p>No synonyms found.</p>";
    }
    html += "</div>";

    // Antonyms
    html += `<h3>Antonyms</h3><div class="antonyms">`;
    if (antonyms.length > 0) {
      antonyms.slice(0, 20).forEach(a => {
        html += `<span onclick="autoSearch('${a.word}')">${a.word}</span>`;
      });
    } else {
      html += "<p>No antonyms found.</p>";
    }
    html += "</div>";

    resultBox.innerHTML = html;

  } catch (error) {
    console.error(error);
    resultBox.innerHTML = "<p>Error fetching data.</p>";
  }
}

function playAudio(src) {
  const audio = document.getElementById("audioPlayer");
  audio.src = src;
  audio.play();
}

function autoSearch(word) {
  document.getElementById("searchInput").value = word;
  searchWord();
}

  </script>
