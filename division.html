    <!-- Hero Section -->
    <section>
     <div class="container">
    <h1>Learn Division</h1>

    <label>Enter Dividend (Number to be divided):</label>
    <input type="number" id="dividend" placeholder="e.g. 20">

    <label>Enter Divisor (Number dividing):</label>
    <input type="number" id="divisor" placeholder="e.g. 4">

    <button onclick="divideNumbers()">Divide</button>

    <div id="resultBox"></div>
</div>
    </section>
<script>
     function divideNumbers() {
    let dividend = document.getElementById("dividend").value;
    let divisor = document.getElementById("divisor").value;

    if (dividend === "" || divisor === "") {
        alert("Please enter both numbers!");
        return;
    }

    if (divisor == 0) {
        document.getElementById("resultBox").innerHTML = `<p style="color:red;">Divisor cannot be 0!</p>`;
        return;
    }

    dividend = Number(dividend);
    divisor = Number(divisor);

    let quotient = (dividend / divisor).toFixed(2);
    let remainder = dividend % divisor;

    document.getElementById("resultBox").innerHTML = `
        <p><b>Dividend:</b> ${dividend}</p>
        <p><b>Divisor:</b> ${divisor}</p>
        <p><b>Quotient:</b> ${quotient}</p>
        <p><b>Remainder:</b> ${remainder}</p>
        <hr>
        <p><b>Explanation:</b></p>
        <p>${dividend} ÷ ${divisor} = ${quotient}</p>
        <p>Because ${divisor} × ${quotient} + ${remainder} = ${dividend}</p>
    `;
}
  </script>
